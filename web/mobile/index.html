<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#191312" />
    <meta name="description" content="转动把手，收集宝可梦与立体闪卡。" />
    <title>手机版 · 宝可梦扭蛋机 · Pokémon Capsule Works</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><circle cx=%2232%22 cy=%2232%22 r=%2228%22 fill=%22%23f3eee2%22/><path d=%22M4 32a28 28 0 0 1 56 0%22 fill=%22%23df5145%22/><path d=%22M4 32h56%22 stroke=%22%232b292c%22 stroke-width=%227%22/><circle cx=%2232%22 cy=%2232%22 r=%2210%22 fill=%22%23fff%22 stroke=%22%232b292c%22 stroke-width=%225%22/></svg>" />
  <link rel="stylesheet" href="/src/mobile-edition.css" />
  </head>
  <body class="mobile-edition">
    <main id="app">
      <div id="machine-stage" aria-label="宝可梦扭蛋机 3D 场景"></div>
      <div class="vignette" aria-hidden="true"></div>

      <header class="brand ui-layer">
        <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48"><defs><clipPath id="brand-ball-clip"><circle cx="24" cy="24" r="20" /></clipPath></defs><g clip-path="url(#brand-ball-clip)"><rect x="4" y="4" width="40" height="40" fill="#f8f1e4" /><path d="M4 4h40v20H4z" fill="#e95143" /><path d="M4 22h40v4H4z" fill="#28272b" /></g><circle cx="24" cy="24" r="20" fill="none" stroke="#28272b" stroke-width="2.5" /><circle cx="24" cy="24" r="7" fill="#f8f1e4" stroke="#28272b" stroke-width="2.5" /><circle cx="24" cy="24" r="3" fill="#fff" stroke="#28272b" stroke-width="1.4" /><ellipse cx="17" cy="12" rx="6" ry="3" fill="#fff" opacity=".65" transform="rotate(-25 17 12)" /></svg></div>
        <div class="brand-copy"><p><span>POKÉMON</span><i></i><span>CAPSULE WORKS</span></p><h1>宝可梦<span>扭蛋机</span></h1><small>TURN · DISCOVER · COLLECT</small></div>
      </header>

      <section class="supply-panel ui-layer" aria-live="polite">
        <small class="supply-eyebrow">CAPSULE RESERVE</small>
        <div class="supply-heading"><span class="status-dot"></span><span id="supply-label">自动补给中</span></div>
        <div class="supply-count"><strong id="queue-count">0</strong><span>/ 5</span></div>
        <div class="supply-track" id="supply-progress" role="progressbar" aria-label="顶部管道储备" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0"><span></span><span></span><span></span><span></span><span></span></div>
        <p>顶部管道储备</p>
      </section>

      <button id="supply-debug" class="supply-debug ui-layer" type="button" aria-pressed="false" aria-label="显示送料路线与球体碰撞外形">路径调试</button>
      <button id="spin-button" class="primary-button mobile-spin ui-layer" hidden>扭一颗</button>

      <div id="crank-hint" class="crank-hint ui-layer" aria-hidden="true"><img src="/assets/ui/crank-hand-left.svg" alt="" draggable="false" /></div>

      <div id="mini-collection" class="mini-collection ui-layer" aria-label="已收集的精灵球"></div>

      <button id="pack-button" class="pack-button ui-layer" aria-label="打开卡牌包">
        <span class="pack-art"><i></i><b>C</b></span>
        <span><small>MY CARD PACK</small><strong>卡牌包 · <em id="pack-count">0</em></strong></span>
      </button>

      <section id="focus-layer" class="focus-layer" aria-label="精灵球与宝可梦观察模式">
        <div id="focus-stage"></div>
        <div class="focus-topbar">
          <div><span class="eyebrow">CAPSULE OBSERVATION</span><h2 id="focus-title">发现一颗精灵球</h2></div>
          <button id="focus-close" class="icon-button" aria-label="返回扭蛋机">×</button>
        </div>
        <div class="focus-actions">
          <button id="make-card" class="side-action"><span>✦</span><strong>收藏为卡牌</strong><small>制作 3D 视差闪卡</small></button>
          <button id="stow-ball" class="side-action"><span>◉</span><strong>收纳精灵球</strong><small>合上并收回右下角</small></button>
          <button id="store-card" class="side-action"><span>▣</span><strong>收纳卡牌</strong><small>保存这张卡牌</small></button>
        </div>
        <div class="focus-bottom"><span id="focus-hint">拖拽旋转观察 · 点击精灵球打开</span><div class="focus-line"></div><span>LEFT DRAG TO ROTATE</span></div>
        <div id="focus-loading" class="focus-loading"><i></i><span>正在唤醒宝可梦…</span></div>
      </section>

      <dialog id="pack-dialog" class="pack-dialog">
        <div class="pack-dialog-header"><div><span class="eyebrow">MY COLLECTION</span><h2>我的卡牌包</h2></div><button id="pack-close" class="icon-button" aria-label="关闭卡牌包">×</button></div>
        <div id="card-grid" class="card-grid"></div>
        <p id="empty-pack" class="empty-pack">还没有卡牌。打开一颗精灵球，把遇到的宝可梦制作成闪卡吧。</p>
      </dialog>

      <div id="toast" class="toast" role="status"></div>
      <div id="loading" class="loading-screen">
        <div id="loading-ball-stage" class="loading-ball-stage" role="img" aria-label="3D 精灵球左右摇晃，按钮闪烁红光"></div><p id="loading-detail">NOW LOADING...</p><div class="loading-track" role="progressbar" aria-label="场景加载进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="loading-progress"></i></div>
      </div>
    </main>
    <script type="module" src="/src/bootstrap.js"></script>
  </body>
</html>
